<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul" xmlns:html="http://www.w3.org/1999/xhtml">
  <linkset><html:link rel="localization" href="repository-detector.ftl"/></linkset>
  <groupbox data-search-strings-raw="Repository Detector, repository, repo, GitHub, Hugging Face, Gitee">
    <label><html:h2>Repository Detector</html:h2></label>
    <checkbox label="新导入论文后自动检测代码仓库" preference="extensions.repositoryDetector.autoDetectOnAdd"/>
    <checkbox label="检测到小型仓库时自动下载并关联到条目" preference="extensions.repositoryDetector.autoDownload"/>
  </groupbox>
  <groupbox>
    <label><html:h2>仓库来源</html:h2></label>
    <checkbox label="GitHub" preference="extensions.repositoryDetector.useGitHub"/>
    <checkbox label="Hugging Face" preference="extensions.repositoryDetector.useHuggingFace"/>
    <checkbox label="Gitee" preference="extensions.repositoryDetector.useGitee"/>
    <checkbox label="在缺少明确链接时按论文标题检索" preference="extensions.repositoryDetector.searchByTitle"/>
  </groupbox>
  <groupbox>
    <label><html:h2>自动下载</html:h2></label>
    <hbox align="center"><label value="自动下载上限（MB）" control="repository-detector-max-download"/><html:input id="repository-detector-max-download" type="number" min="0.05" step="0.05" style="width: 8em; margin-inline-start: .6em" preference="extensions.repositoryDetector.maxDownloadMB"/></hbox>
    <description>默认 1 MB。只有能够可靠获得仓库大小且当前快照不超过该阈值时才自动下载。</description>
  </groupbox>
  <groupbox>
    <label><html:h2>识别与筛选</html:h2></label>
    <hbox align="center"><label value="标题检索最低置信度" control="repository-detector-confidence"/><html:input id="repository-detector-confidence" type="number" min="0.5" max="1" step="0.01" style="width: 8em; margin-inline-start: .6em" preference="extensions.repositoryDetector.minConfidence"/></hbox>
    <hbox align="center"><label value="Repository 标签" control="repository-detector-tag"/><html:input id="repository-detector-tag" type="text" style="width: 16em; margin-inline-start: .6em" preference="extensions.repositoryDetector.tagName"/></hbox>
    <description>检测到仓库后会自动添加该标签，可直接使用 Zotero 左下角标签选择器快速筛选。</description>
  </groupbox>
  <groupbox>
    <label><html:h2>国内访问</html:h2></label>
    <label value="GitHub 镜像/加速前缀（每行一个，直连失败后依次尝试）"/>
    <html:textarea rows="3" style="width: 100%; min-height: 5em" preference="extensions.repositoryDetector.githubMirrors"/>
    <label value="Hugging Face 镜像"/><html:input type="text" style="width: 100%" preference="extensions.repositoryDetector.hfMirror"/>
    <description>插件始终先尝试官方地址。镜像只用于公开资源，不向第三方镜像发送任何账号凭据。</description>
  </groupbox>
  <groupbox>
    <label><html:h2>网络</html:h2></label>
    <hbox align="center"><label value="单次请求超时（秒）" control="repository-detector-timeout"/><html:input id="repository-detector-timeout" type="number" min="5" max="120" step="1" style="width: 8em; margin-inline-start: .6em" preference="extensions.repositoryDetector.requestTimeoutSeconds"/></hbox>
    <hbox align="center"><label value="每个平台最多检查候选数" control="repository-detector-candidates"/><html:input id="repository-detector-candidates" type="number" min="1" max="20" step="1" style="width: 8em; margin-inline-start: .6em" preference="extensions.repositoryDetector.maxCandidatesPerService"/></hbox>
  </groupbox>
</vbox>
