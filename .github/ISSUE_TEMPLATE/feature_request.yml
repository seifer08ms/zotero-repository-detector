name: Feature request
description: Suggest an improvement to Repository Detector
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: Describe the workflow or problem this feature should improve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
