name: Bug report
description: Report a reproducible Repository Detector problem
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: zotero
    attributes:
      label: Zotero version
      placeholder: "7.0.32"
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Repository Detector version
      placeholder: "0.2.2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the item type, repository URL/provider, and what you clicked.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Zotero debug output
      render: text
