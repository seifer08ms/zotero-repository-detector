name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Pack XPI
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd .scaffold/build/addon
          zip -r "${GITHUB_WORKSPACE}/repository-detector-${VERSION}.xpi" .

      - name: Generate Zotero update manifest
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/generate-update.mjs "repository-detector-${VERSION}.xpi"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            repository-detector-*.xpi
            update.json
