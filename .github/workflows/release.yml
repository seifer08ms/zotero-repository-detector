name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released; skipping."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.existing.outputs.released != 'true'
        run: npm install

      - name: Build plugin
        if: steps.existing.outputs.released != 'true'
        run: npm run build

      - name: Pack XPI
        if: steps.existing.outputs.released != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd .scaffold/build/addon
          zip -r "${GITHUB_WORKSPACE}/repository-detector-${VERSION}.xpi" .

      - name: Generate Zotero update manifest
        if: steps.existing.outputs.released != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/generate-update.mjs "repository-detector-${VERSION}.xpi"

      - name: Create tag and GitHub Release
        if: steps.existing.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG"             "repository-detector-${VERSION}.xpi"             "update.json"             --target "$GITHUB_SHA"             --title "Repository Detector v${VERSION}"             --generate-notes
